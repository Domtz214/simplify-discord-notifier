name: Check New Internships

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual triggers from GitHub UI or CLI

jobs:
  check-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up consecutive action runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Parser Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python parse_and_notify.py

      - name: Commit state changes (seen_jobs.json)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update seen_jobs.json [skip ci]"
          file_pattern: "seen_jobs.json"
