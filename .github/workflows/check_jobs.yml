name: Check New Internships

on:
  workflow_dispatch: # Triggered externally by cron-job.org every 15 min

# Prevents two runs from ever executing at the same time.
# If a run is triggered while one is still in progress, it queues
# instead of racing it — this is what caused the earlier push failure.
concurrency:
  group: check-jobs-single-run
  cancel-in-progress: false

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up consecutive action runs
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Job Parser Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python parse_and_notify.py
      - name: Commit state changes (seen_jobs.json)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update seen_jobs.json [skip ci]"
          file_pattern: "seen_jobs.json"
